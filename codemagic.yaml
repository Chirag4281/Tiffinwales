workflows:
  ios-release:
    name: iOS Release Build - Tiffinwales
    instance_type: mac_mini_m2
    max_build_duration: 60

    environment:
      flutter: stable
      xcode: latest
      cocoapods: default

      vars:
        BUNDLE_ID: "com.tiffinwales.app"
        BUILD_MODE: "release"

      ios_signing:
        distribution_type: app_store
        bundle_identifier: "com.tiffinwales.app"

    integrations:
      app_store_connect: "Codemagic"

    scripts:
      - name: Get dependencies
        script: |
          flutter clean
          flutter pub get

      - name: Install CocoaPods
        script: |
          cd ios
          pod install --repo-update
          cd ..

      - name: Build IPA
        script: |
          flutter build ipa --release

    artifacts:
      - build/ios/ipa/*.ipa

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        submit_to_app_store: false
