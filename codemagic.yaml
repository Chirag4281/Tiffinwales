workflows:
  ios-release:
    name: iOS Release Build - Tiffinwales
    instance_type: mac_mini_m2
    max_build_duration: 60

    environment:
      vars:
        BUNDLE_ID: "com.tiffinwales.app"
        BUILD_MODE: "release"
      flutter: stable
      xcode: latest
      cocoapods: default

    integrations:
      app_store_connect: "Codemagic"

    scripts:

      - name: Get dependencies
        script: |
          flutter clean
          flutter pub get

      - name: Set iOS deployment target
        script: |
          python3 - <<'PY'
          from pathlib import Path

          podfile = Path("ios/Podfile")

          if podfile.exists():
              text = podfile.read_text()

              if "platform :ios" not in text:
                  text = "platform :ios, '15.0'\n\n" + text

              else:
                  import re
                  text = re.sub(
                      r"platform\s+:ios,\s*['\"][^'\"]+['\"]",
                      "platform :ios, '15.0'",
                      text,
                      count=1
                  )

              podfile.write_text(text)
          PY

      - name: Install pods
        script: |
          cd ios
          pod install --repo-update
          cd ..

      - name: Automatic code signing
        script: |
          xcode-project use-profiles

      - name: Set automatic signing
        script: |
          xcode-project set-code-signing \
            --project ios/Runner.xcodeproj \
            --team-id "$CM_TEAM_ID" \
            --bundle-id "$BUNDLE_ID" \
            --build-settings CODE_SIGN_STYLE=Automatic

      - name: Set unique build number
        script: |
          BUILD_NUMBER="${BUILD_NUMBER:-$CM_BUILD_ID}"

          if [ -z "$BUILD_NUMBER" ]; then
            BUILD_NUMBER=$(date +%s)
          fi

          echo "Using iOS build number: $BUILD_NUMBER"

          flutter build ipa \
            --release \
            --build-number="$BUILD_NUMBER"

      - name: Verify archive
        script: |
          echo "IPA files:"
          ls -lah build/ios/ipa/

    artifacts:
      - build/ios/ipa/*.ipa

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
