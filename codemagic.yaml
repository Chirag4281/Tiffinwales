workflows:
  ios-release:
    name: iOS Release Build - Tiffinwales
    instance_type: mac_mini_m2
    max_build_duration: 60

    environment:
      vars:
        BUNDLE_ID: "com.tiffinwales.app"
      flutter: stable
      xcode: latest
      cocoapods: default

    integrations:
      app_store_connect: "Codemagic"  # ✅ Your correct integration name

    scripts:
      - name: Get dependencies
        script: |
          flutter clean
          flutter pub get

      - name: Install pods
        script: |
          cd ios
          pod install --repo-update
          cd ..

      - name: List available certificates
        script: |
          security find-identity -v -p codesigning

      - name: Setup code signing
        script: |
          xcode-project use-profiles

      - name: Build IPA
        script: |
          flutter build ipa --release

    artifacts:
      - build/ios/ipa/*.ipa

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
