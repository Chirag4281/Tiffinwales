workflows:
  ios-release:
    name: iOS Release Build - Tiffinwales

    instance_type: mac_mini_m2
    max_build_duration: 60

    integrations:
      app_store_connect: "Codemagic"

    environment:
      flutter: stable
      xcode: latest
      cocoapods: default

      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.tiffinwales.app

      vars:
        BUNDLE_ID: "com.tiffinwales.app"

    scripts:

      # ----------------------------------------
      # 1. Flutter dependencies
      # ----------------------------------------
      - name: Get Flutter dependencies
        script: |
          flutter clean
          flutter pub get

      # ----------------------------------------
      # 2. Set iOS deployment target
      # ----------------------------------------
      - name: Set iOS deployment target
        script: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path("ios/Podfile")

          if not path.exists():
              raise SystemExit("ERROR: ios/Podfile not found")

          text = path.read_text()

          pattern = r"platform\s*:ios,\s*['\"][^'\"]+['\"]"

          if re.search(pattern, text):
              text = re.sub(
                  pattern,
                  "platform :ios, '15.0'",
                  text,
                  count=1
              )
          else:
              text = "platform :ios, '15.0'\n\n" + text

          path.write_text(text)

          print("iOS deployment target set to 15.0")
          PY

      # ----------------------------------------
      # 3. Install CocoaPods
      # ----------------------------------------
      - name: Install CocoaPods
        script: |
          cd ios
          pod install --repo-update
          cd ..

      # ----------------------------------------
      # 4. AUTOMATIC CODE SIGNING
      # ----------------------------------------
      - name: Automatic iOS code signing
        script: |
          echo "=========================================="
          echo "AUTOMATIC CODE SIGNING"
          echo "=========================================="

          xcode-project use-profiles \
            --project ios/Runner.xcodeproj

      # ----------------------------------------
      # 5. Verify signing
      # ----------------------------------------
      - name: Verify signing
        script: |
          echo "=========================================="
          echo "SIGNING CERTIFICATES"
          echo "=========================================="

          security find-identity -v -p codesigning || true

          echo ""
          echo "=========================================="
          echo "PROVISIONING PROFILES"
          echo "=========================================="

          ls -lah \
            "$HOME/Library/MobileDevice/Provisioning Profiles/" \
            || true

      # ----------------------------------------
      # 6. Automatic build number
      # ----------------------------------------
      - name: Generate build number
        script: |
          if [ -n "$CM_BUILD_ID" ]; then
            BUILD_NUMBER="$CM_BUILD_ID"
          else
            BUILD_NUMBER="$(date +%s)"
          fi

          echo "BUILD_NUMBER=$BUILD_NUMBER"

          echo "BUILD_NUMBER=$BUILD_NUMBER" >> "$CM_ENV"

      # ----------------------------------------
      # 7. Build signed IPA
      # ----------------------------------------
      - name: Build IPA
        script: |
          echo "=========================================="
          echo "BUILDING SIGNED IPA"
          echo "=========================================="

          echo "Bundle ID: $BUNDLE_ID"
          echo "Build Number: $BUILD_NUMBER"

          flutter build ipa \
            --release \
            --build-number="$BUILD_NUMBER" \
            --export-options-plist=/Users/builder/export_options.plist

      # ----------------------------------------
      # 8. Verify IPA
      # ----------------------------------------
      - name: Verify IPA
        script: |
          echo "=========================================="
          echo "IPA OUTPUT"
          echo "=========================================="

          ls -lah build/ios/ipa/

    artifacts:
      - build/ios/ipa/*.ipa

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
