workflows:
  ios-release:
    name: iOS Release Build - Tiffinwales
    instance_type: mac_mini_m2
    max_build_duration: 60

    environment:
      vars:
        BUNDLE_ID: "com.tiffinwales.app"  # ← UPDATE THIS
      flutter: stable
      xcode: latest
      cocoapods: default

    integrations:
      app_store_connect: "Codemagic"  # ← Your existing integration

    scripts:
      - name: Get dependencies
        script: |
          flutter clean
          flutter pub get

      - name: Install pods
        script: |
          cd ios && pod install && cd ..

      - name: Setup signing
        script: |
          xcode-project use-profiles

      - name: Build IPA
        script: |
          flutter build ipa --release

    artifacts:
      - build/ios/ipa/*.ipa

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        # submit_to_app_store: false  # Uncomment when ready for production
