workflows:
  ios-release:
    name: iOS Release Build - Tiffinwales
    instance_type: mac_mini_m2
    max_build_duration: 60

    environment:
      vars:
        BUNDLE_ID: "com.tiffinwales.app"
        TEAM_ID: "A636V85WH2"  # ← Add your Team ID (optional but recommended)
      flutter: stable
      xcode: latest
      cocoapods: default

    integrations:
      app_store_connect: "Codemagic"

    scripts:
      - name: Get dependencies
        script: |
          flutter clean
          flutter pub get

      - name: Install pods
        script: |
          cd ios
          pod install --repo-update
          cd ..

      - name: Setup automatic code signing
        script: |
          # This automatically creates certificates and profiles
          xcode-project use-profiles

      - name: Build IPA
        script: |
          flutter build ipa --release

    artifacts:
      - build/ios/ipa/*.ipa

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
