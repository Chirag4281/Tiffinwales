workflows:
  ios-release:
    name: iOS Release Build - TiffinWales
    instance_type: mac_mini_m2
    max_build_duration: 60

    integrations:
      app_store_connect: "Codemagic"

    environment:
      flutter: stable
      xcode: latest
      cocoapods: default

      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.tiffinwales.app

      vars:
        BUNDLE_ID: "com.tiffinwales.app"
        BUILD_MODE: "release"

    scripts:

      - name: Get Flutter dependencies
        script: |
          flutter clean
          flutter pub get

      - name: Install CocoaPods
        script: |
          cd ios
          pod install --repo-update
          cd ..

      - name: Configure iOS automatic signing
        script: |
          echo "========================================"
          echo "CONFIGURING IOS CODE SIGNING"
          echo "========================================"

          echo "Bundle ID:"
          echo "$BUNDLE_ID"

          echo "Available provisioning profiles:"
          ls -la "$HOME/Library/MobileDevice/Provisioning Profiles/" || true

          echo "Using Codemagic signing profiles..."
          xcode-project use-profiles

      - name: Verify Xcode signing configuration
        script: |
          echo "========================================"
          echo "VERIFYING XCODE PROJECT"
          echo "========================================"

          xcodebuild \
            -workspace ios/Runner.xcworkspace \
            -scheme Runner \
            -showBuildSettings | \
            grep -E "PRODUCT_BUNDLE_IDENTIFIER|DEVELOPMENT_TEAM|CODE_SIGN|PROVISIONING_PROFILE"

      - name: Build IPA
        script: |
          echo "========================================"
          echo "BUILDING SIGNED IPA"
          echo "========================================"

          flutter build ipa \
            --release \
            --export-options-plist=/Users/builder/export_options.plist

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        submit_to_app_store: false
