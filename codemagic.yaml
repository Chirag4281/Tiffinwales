workflows:
  ios-release:
    name: iOS Release Build - TiffinWales
    instance_type: mac_mini_m2
    max_build_duration: 60

    integrations:
      app_store_connect: "Codemagic"

    environment:
      flutter: stable
      xcode: latest
      cocoapods: default

      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.tiffinwales.app

      vars:
        BUNDLE_ID: "com.tiffinwales.app"
        BUILD_MODE: "release"

    scripts:

      # 1. Get Flutter dependencies
      - name: Get dependencies
        script: |
          flutter clean
          flutter pub get

      # 2. Install CocoaPods
      - name: Install CocoaPods dependencies
        script: |
          cd ios
          pod install --repo-update
          cd ..

      # 3. AUTOMATIC iOS CODE SIGNING
      - name: Configure automatic code signing
        script: |
          xcode-project use-profiles

      # 4. Build signed IPA
      - name: Build IPA
        script: |
          flutter build ipa --release

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        submit_to_app_store: true
