
workflows:
  ios-release:
    name: iOS Release Build - Tiffinwales
    instance_type: mac_mini_m2
    max_build_duration: 60

    environment:
      vars:
        BUNDLE_ID: "com.tiffinwales.app"
        BUILD_MODE: "release"
      flutter: stable
      xcode: latest
      cocoapods: default

    integrations:
      app_store_connect: "Codemagic"

    scripts:

      # ----------------------------------------
      # 1. Flutter dependencies
      # ----------------------------------------
      - name: Get dependencies
        script: |
          flutter clean
          flutter pub get

      # ----------------------------------------
      # 2. Force iOS 15 for CocoaPods
      # ----------------------------------------
      - name: Configure iOS deployment target
        script: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          podfile = Path("ios/Podfile")

          if not podfile.exists():
              raise SystemExit("ERROR: ios/Podfile not found")

          text = podfile.read_text()

          pattern = r"platform\s*:ios,\s*['\"][^'\"]+['\"]"

          if re.search(pattern, text):
              text = re.sub(
                  pattern,
                  "platform :ios, '15.0'",
                  text,
                  count=1
              )
          else:
              text = "platform :ios, '15.0'\n\n" + text

          podfile.write_text(text)

          print("iOS deployment target configured: 15.0")
          PY

          grep -n "platform :ios" ios/Podfile || true

      # ----------------------------------------
      # 3. Install CocoaPods
      # ----------------------------------------
      - name: Install pods
        script: |
          cd ios
          pod deintegrate || true
          pod install --repo-update
          cd ..

      # ----------------------------------------
      # 4. Configure Codemagic signing
      # ----------------------------------------
      - name: Setup automatic signing
        script: |
          echo "Configuring iOS code signing..."

          xcode-project use-profiles

      # ----------------------------------------
      # 5. Show signing configuration
      # ----------------------------------------
      - name: Verify signing configuration
        script: |
          echo "Bundle ID:"
          echo "$BUNDLE_ID"

          echo ""
          echo "Provisioning profiles:"
          ls -lah "$HOME/Library/MobileDevice/Provisioning Profiles/" || true

          echo ""
          echo "Certificates:"
          security find-identity -v -p codesigning || true

      # ----------------------------------------
      # 6. Generate unique build number
      # ----------------------------------------
      - name: Generate build number
        script: |
          if [ -n "$CM_BUILD_ID" ]; then
            BUILD_NUMBER="$CM_BUILD_ID"
          else
            BUILD_NUMBER="$(date +%s)"
          fi

          echo "BUILD_NUMBER=$BUILD_NUMBER"

          echo "BUILD_NUMBER=$BUILD_NUMBER" >> "$CM_ENV"

      # ----------------------------------------
      # 7. Build IPA
      # ----------------------------------------
      - name: Build IPA
        script: |
          echo "Building Tiffinwales iOS IPA..."
          echo "Bundle ID: $BUNDLE_ID"
          echo "Build Number: $BUILD_NUMBER"

          flutter build ipa \
            --release \
            --build-number="$BUILD_NUMBER"

      # ----------------------------------------
      # 8. Verify IPA
      # ----------------------------------------
      - name: Verify IPA
        script: |
          echo "Generated IPA files:"
          ls -lah build/ios/ipa/

    artifacts:
      - build/ios/ipa/*.ipa

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true

