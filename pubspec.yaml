name: tiffinwales
description: TiffinWales - Authentic Indian Cuisine Delivery
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  webview_flutter: ^4.4.2
  #Notification
  firebase_messaging: ^15.1.3
  firebase_core: ^3.6.0
  video_player: ^2.8.2
  cached_network_image: ^3.3.0
    # OneSignal
  onesignal_flutter: ^5.0.0
  url_launcher: ^6.2.5
    # For local notifications (optional but recommended)
  flutter_local_notifications: ^17.0.0

    # For handling background messages
  flutter_background: ^1.2.0
  geocoding: ^2.1.0
  location: ^5.0.0
  # UI & Styling
  mhj_maps: ^1.0.0
  google_fonts: ^6.1.0
  page_transition: ^2.1.0
  flutter_svg: ^2.0.9
  app_links: ^3.5.0
  latlong2: ^0.9.0
  # State Management
  provider: ^6.0.5

  # Networking - HTTP requests to PHP backend
  http: ^1.1.0
  dio: ^5.3.2
  local_auth: ^2.3.0
  # Local Storage
  shared_preferences: ^2.2.2
  flutter_secure_storage: ^9.0.0

  # Utilities
  intl: ^0.18.1

  image_picker: ^1.0.4

  # Payment


  # Maps
  google_maps_flutter: ^2.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1
  flutter_launcher_icons: ^0.14.4
flutter:
  uses-material-design: true

  assets:
    - assets/images/
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/icon.png"

  # Android adaptive icon
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/images/icon.png"

  # iOS
  remove_alpha_ios: true
  background_color_ios: "#FFFFFF"

  android_legacy: true
